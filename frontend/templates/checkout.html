<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.checkout_title">CityFlow — 결제</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body class="auth-page">
    <button class="btn btn-ghost btn-sm auth-lang-toggle" type="button" data-lang-toggle>EN</button>
    <div class="auth-card checkout-card">
        <h1 data-i18n="checkout.title">CityFlow 결제</h1>
        {% if error %}
        <p class="auth-error">{{ error }}</p>
        <p><a class="btn btn-ghost full-width" href="/" data-i18n="checkout.back">돌아가기</a></p>
        {% else %}
        <p class="auth-sub">{{ order.order_name }} · {{ user_name }}</p>
        <p class="pro-price">${{ order.price_usd }}/{{ 'mo' if lang == 'en' else '월' }} <span>₩{{ "{:,}".format(order.amount) }}</span></p>
        <div id="payment-method"></div>
        <div id="agreement"></div>
        <button type="button" class="btn btn-premium full-width" id="paymentButton" data-i18n="checkout.pay">토스로 결제하기</button>
        <p class="panel-desc" data-i18n="checkout.note">결제 완료 후 등록하신 토스페이먼츠 정산 계좌로 입금됩니다.</p>
        <p><a href="/" data-i18n="checkout.cancel">취소하고 돌아가기</a></p>
        {% endif %}
    </div>
    <script src="/js/i18n.js"></script>
    {% if not error and order %}
    <script>
    (async () => {
        const tossPayments = TossPayments({{ client_key|tojson }});
        const widgets = tossPayments.widgets({ customerKey: {{ customer_key|tojson }} });
        await widgets.setAmount({ currency: 'KRW', value: {{ order.amount }} });
        await Promise.all([
            widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' }),
            widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' }),
        ]);
        document.getElementById('paymentButton').addEventListener('click', async () => {
            try {
                await widgets.requestPayment({
                    orderId: {{ order.order_id|tojson }},
                    orderName: {{ order.order_name|tojson }},
                    successUrl: `${window.location.origin}/pro/success`,
                    failUrl: `${window.location.origin}/pro/fail`,
                });
            } catch (err) {
                alert(err?.message || window.t('checkout.open_fail'));
            }
        });
    })();
    </script>
    {% endif %}
</body>
</html>
