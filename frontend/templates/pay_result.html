<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.pay_title">CityFlow — 결제 결과</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>{{ t('pay.ok') if ok else t('pay.fail') }}</h1>
        <p class="auth-sub">{{ message }}</p>
        {% if player and player.is_pro %}
        <p class="pro-price">{{ t('pay.until', plan=player.plan_label, date=(player.pro_until[:10] if player.pro_until else '')) }}</p>
        {% endif %}
        <a class="btn btn-premium full-width" href="/" data-i18n="pay.back">시뮬레이션으로 돌아가기</a>
    </div>
    <script src="/js/i18n.js"></script>
</body>
</html>
