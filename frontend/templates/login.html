<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.login_title">CityFlow — 로그인</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
    <button class="btn btn-ghost btn-sm auth-lang-toggle" type="button" data-lang-toggle>EN</button>
    <div class="auth-card">
        <h1>CityFlow</h1>
        <p class="auth-sub" data-i18n="login.sub">교통 시뮬레이션에 로그인하세요</p>

        <form id="loginForm" class="auth-form">
            <label>
                <span data-i18n="login.id">로그인 ID</span>
                <input type="text" id="loginId" autocomplete="username" required minlength="3">
            </label>
            <label>
                <span data-i18n="login.password">비밀번호</span>
                <input type="password" id="loginPassword" autocomplete="current-password" required minlength="8">
            </label>
            <button type="submit" class="btn btn-premium full-width" data-i18n="login.submit">로그인</button>
        </form>

        <hr class="auth-divider">

        <form id="registerForm" class="auth-form">
            <h2 data-i18n="login.register">회원가입</h2>
            <label>
                <span data-i18n="login.name">이름</span>
                <input type="text" id="registerName" required>
            </label>
            <label>
                <span data-i18n="login.id">로그인 ID</span>
                <input type="text" id="registerLoginId" autocomplete="username" required minlength="3">
            </label>
            <label>
                <span data-i18n="login.password_hint">비밀번호 (8자 이상)</span>
                <input type="password" id="registerPassword" autocomplete="new-password" required minlength="8">
            </label>
            <button type="submit" class="btn btn-secondary full-width" data-i18n="login.signup">가입하기</button>
        </form>

        {% if google_enabled %}
        <a class="btn google-btn full-width" href="/auth/google" data-i18n="login.google">Google로 계속하기</a>
        {% else %}
        <p class="auth-note" data-i18n="login.google_note">Google 로그인: all_variable.json의 auth.google_client_id / secret 설정 후 google_enabled를 true로 변경하세요.</p>
        {% endif %}

        <p id="authMessage" class="auth-message"></p>
    </div>

    <script src="/js/i18n.js"></script>
    <script>
        const showMsg = (text, ok = true) => {
            const el = document.getElementById('authMessage');
            el.textContent = text;
            el.className = ok ? 'auth-message ok' : 'auth-message err';
        };

        const parseJson = async (res) => {
            try {
                return await res.json();
            } catch {
                return { ok: false, message: window.t('login.parse') };
            }
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        login_id: document.getElementById('loginId').value,
                        password: document.getElementById('loginPassword').value,
                    }),
                });
                const data = await parseJson(res);
                if (data.ok) {
                    window.location.href = '/';
                } else {
                    showMsg(data.message || window.t('login.fail'), false);
                }
            } catch {
                showMsg(window.t('login.network'), false);
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginId = document.getElementById('registerLoginId').value;
            const password = document.getElementById('registerPassword').value;
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('registerName').value,
                        login_id: loginId,
                        password,
                    }),
                });
                const data = await parseJson(res);
                if (data.ok && data.auto_login) {
                    window.location.href = '/';
                    return;
                }
                showMsg(data.message, data.ok);
                if (data.ok) {
                    document.getElementById('loginId').value = loginId;
                    document.getElementById('loginPassword').value = password;
                    document.getElementById('loginId').focus();
                }
            } catch {
                showMsg(window.t('login.network'), false);
            }
        });
    </script>
</body>
</html>
